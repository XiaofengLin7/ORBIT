# FrozenLake multi-task config for multi-episode self-distillation training.
#
# Notes:
# - Do NOT set `desc` so each trajectory gets a different map from its unique seed.
# - Train and validation tasks use different parameterizations so they are not the same task distribution.

train_tasks:
  - env_id: "frozenlake"
    inner_env_class: "envs.frozenlake_env_adapter.FrozenLakeEnvAdapter"
    max_turns_per_episode: 10
    total_step_cap: 20
    size: 5
    p: 0.82
    is_slippery: false
    train_size: 1024

  - env_id: "frozenlake"
    inner_env_class: "envs.frozenlake_env_adapter.FrozenLakeEnvAdapter"
    max_turns_per_episode: 12
    total_step_cap: 24
    size: 6
    p: 0.78
    is_slippery: false
    train_size: 1024

val_tasks:
  - env_id: "frozenlake"
    inner_env_class: "envs.frozenlake_env_adapter.FrozenLakeEnvAdapter"
    max_turns_per_episode: 10
    total_step_cap: 20
    size: 5
    p: 0.70
    is_slippery: true
    test_size: 256

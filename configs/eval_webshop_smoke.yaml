# Smoke test config for WebShop — tiny subset to verify the pipeline works end-to-end.

train_tasks:
  - env_id: "game:Mastermind-v0-random"
    max_turns_per_episode: 3
    total_step_cap: 9
    code_length: 3
    num_numbers: 6
    duplicate_numbers: False
    train_size: 32
    inner_env_class: 'envs.gem_env_adapter.GEMEnvAdapter'

val_tasks:
  - env_id: "webshop"
    max_turns_per_episode: 10
    total_step_cap: 30
    test_size: 4                    # tiny subset for smoke test
    inner_env_class: 'envs.webshop_env_adapter.WebShopEnvAdapter'
    split: "test"
    observation_mode: "text"

# Dummy train_tasks required by prepare_multi_task_gem_data (eval-only: total_epochs=0)
train_tasks:
  - env_id: "game:Mastermind-v0-random"
    max_turns_per_episode: 3
    total_step_cap: 9
    code_length: 3
    num_numbers: 6
    duplicate_numbers: False
    train_size: 32
    inner_env_class: 'envs.gem_env_adapter.GEMEnvAdapter'

val_tasks:
  - env_id: "alfworld"
    max_turns_per_episode: 10
    total_step_cap: 30   # 3 episodes x 10 turns
    test_size: 134        # valid_unseen game count
    inner_env_class: 'envs.alfworld_env_adapter.ALFWorldEnvAdapter'
    eval_split: "eval_out_of_distribution"
    config_path: "configs/config_alfworld_tw.yaml"


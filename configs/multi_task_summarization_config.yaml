  - env_id: "game:Hangman-v0-easy"
    max_turns_per_episode: 10
    num_episodes: 5
    total_step_cap: 50
    train_size: 128
    inner_env_class: 'envs.gem_env_adapter.GEMEnvAdapter'

  # ---- Mastermind (max_turns=3) — moved from val ---------------------------
  - env_id: "game:Mastermind-v0-random"
    max_turns_per_episode: 3
    num_episodes: 2
    total_step_cap: 6
    code_length: 3
    num_numbers: 6
    duplicate_numbers: False
    train_size: 128
    inner_env_class: 'envs.gem_env_adapter.GEMEnvAdapter'
  - env_id: "game:Mastermind-v0-random"
    max_turns_per_episode: 3
    num_episodes: 3
    total_step_cap: 9
    code_length: 3
    num_numbers: 6
    duplicate_numbers: False
    train_size: 128
    inner_env_class: 'envs.gem_env_adapter.GEMEnvAdapter'
  - env_id: "game:Mastermind-v0-random"
    max_turns_per_episode: 3
    num_episodes: 4
